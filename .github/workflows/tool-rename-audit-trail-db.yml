  update-terraform-state:
    name: Fix Terraform State
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 15
    env:
      TF_WORKING_DIR: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.13.4

      - name: Azure Login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Switch to Platform Subscription
        run: az account set --subscription ${{ secrets.PLATFORM_AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER_NAME }}" \
            -backend-config="key=${{ vars.TFSTATE_KEY }}" \
            -backend-config="subscription_id=${{ secrets.PLATFORM_AZURE_SUBSCRIPTION_ID }}"
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.PLATFORM_AZURE_SUBSCRIPTION_ID }}

      - name: Switch to Deployment Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # These values only need to be *valid*, not necessarily the ones a real deploy would pick -
      # this job only ever plans/imports with -target on the database resource below, so drift on
      # the container apps (which always shows a diff by design - see new_deployment_revision_suffix)
      # is irrelevant here. We still fetch real current values to avoid confusing output.
      # - name: Get current deployment values
      #   id: current
      #   run: |
      #     ENV_LOWER=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')

      #     API_CURRENT_SUFFIX=$(az containerapp revision list --name ${ENV_LOWER}-${{ vars.API_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} --query "[?properties.trafficWeight==\`100\`].name" -o tsv | awk -F'--' '{print $2}')
      #     APP_CURRENT_SUFFIX=$(az containerapp revision list --name ${ENV_LOWER}-${{ vars.APP_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} --query "[?properties.trafficWeight==\`100\`].name" -o tsv | awk -F'--' '{print $2}')
      #     CURRENT_IMAGE_TAG=$(az containerapp show --name ${ENV_LOWER}-${{ vars.API_NAME }} --resource-group ${{ vars.RESOURCE_GROUP }} --query "properties.template.containers[0].image" -o tsv | awk -F':' '{print $NF}')

      #     echo "api_current_suffix=${API_CURRENT_SUFFIX}" >> "$GITHUB_OUTPUT"
      #     echo "app_current_suffix=${APP_CURRENT_SUFFIX}" >> "$GITHUB_OUTPUT"
      #     echo "current_image_tag=${CURRENT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Re-import renamed database into state
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform state rm azurerm_postgresql_flexible_server_database.postgres_audit_trail || true
          terraform import azurerm_postgresql_flexible_server_database.postgres_audit_trail \
            "${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ID }}/databases/${{ inputs.environment }}-audit-trail"
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_shared_postgres_flexible_server_id: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ID}}
          TF_VAR_shared_postgres_flexible_server_fqdn: ${{ vars.SHARED_POSTGRES_FLEXIBLE_SERVER_FQDN }}
          TF_VAR_shared_postgres_flexible_server_admin_username: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ADMIN_USERNAME }}
          TF_VAR_shared_postgres_flexible_server_admin_password: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ADMIN_PASSWORD }}          
          TF_VAR_container_image_tag: ${{ steps.current.outputs.current_image_tag }}
          TF_VAR_environment: ${{ inputs.environment }}
          

      - name: Verify renamed database has no pending changes
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -target=azurerm_postgresql_flexible_server_database.postgres_audit_trail -detailed-exitcode
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_shared_postgres_flexible_server_id: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ID}}
          TF_VAR_shared_postgres_flexible_server_fqdn: ${{ vars.SHARED_POSTGRES_FLEXIBLE_SERVER_FQDN }}
          TF_VAR_shared_postgres_flexible_server_admin_username: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ADMIN_USERNAME }}
          TF_VAR_shared_postgres_flexible_server_admin_password: ${{ secrets.SHARED_POSTGRES_FLEXIBLE_SERVER_ADMIN_PASSWORD }}          
          TF_VAR_container_image_tag: ${{ steps.current.outputs.current_image_tag }}
          TF_VAR_environment: ${{ inputs.environment }}